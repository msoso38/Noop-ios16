name: Build iOS 16 IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          # Ensure the -scheme matches the target name generated by XcodeGen
          xcodebuild archive \
            -project NOOP.xcodeproj \
            -scheme NOOP \
            -sdk iphoneos \
            -archivePath $WORKSPACE/build/NOOP.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS=""

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r build/NOOP.xcarchive/Products/Applications/*.app Payload/
          zip -r NOOP_iOS16.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-iOS16-Unsigned
          path: NOOP_iOS16.ipa
